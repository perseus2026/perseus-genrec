extends:
- data-retail-cross-global.yaml
- onerec-base.yaml
event_encoders:
  history:
    type: concat_projection
    params:
      additive_features:
      - event
  global_history:
    type: concat_projection
    params:
      additive_features:
      - event
inputs:
  short:
    event_encoder: history
  like:
    event_encoder: history
  lifelong:
    event_encoder: global_history
    compression:
      type: qformer
      params:
        num_queries: 361
        num_layers: 2
        num_heads: 4
        dim_feedforward: 512
  user:
    aggregation:
      type: concat_projection
training:
  dataloader:
    batch_size: 256
  gradient_accumulation_steps: 2
