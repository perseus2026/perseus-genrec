task:
  type: retrieval
  metrics:
    Recall@100:
      type: recall_at_k
      params:
        k: 100
    NDCG@100:
      type: ndcg_at_k
      params:
        k: 100
  objective:
    type: autoregressive_semantic_id
    target: item
    target_mode: all_targets_independent
    loss:
      type: cross_entropy
      reduction: mean_tokens_then_targets_global
max_duration_per_sequence: 365d
model:
  type: onerec
  params:
    backbone: t5
    dim: 256
    num_heads: 4
    dim_feedforward: 512
    dropout: 0.1
    weight_initialization: default
    target_chunk_size: 128
    encoder:
      num_layers: 4
      position_embeddings:
      - daily_recency
      - qformer_recency
      - absolute
      source_position_layout: fixed
    decoder:
      num_layers: 4
      level_embeddings: true
    decoder_activation_checkpointing: false
training:
  num_epochs: 4
  log_every_n_train_steps: 500
  validation_every_n_epochs: 1
  tracker:
    type: logging
  dataloader:
    batch_size: 512
    num_workers: 8
    pin_memory: true
    shuffle: true
    seed: 42
  validation_dataloader:
    batch_size: 32
    num_workers: 8
    pin_memory: true
  optimizer:
    type: adam
    params:
      lr: 0.0005
  scheduler:
    type: constant
  early_stopping:
    metric: Recall@100
    patience: 4
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  mixed_precision: bf16
inference:
  event_store_backend: disk
  mixed_precision: bf16
  predict_kwargs:
    k: 100
    beam_size: 100
  dataloader:
    batch_size: 16
    num_workers: 0
    pin_memory: true
