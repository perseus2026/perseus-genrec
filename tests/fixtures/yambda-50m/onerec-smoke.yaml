# Standalone smoke recipe with its own Recall/NDCG@10 metrics.
# Materialize with --sample-limit=32 for a local CPU smoke run.
task:
  type: retrieval
  baseline: null
  metrics:
    Recall@10:
      type: recall_at_k
      params:
        k: 10
    NDCG@10:
      type: ndcg_at_k
      params:
        k: 10
  objective:
    type: autoregressive_semantic_id
    target: item
    target_mode: all_targets_independent
    loss:
      type: cross_entropy
      reduction: mean_tokens_then_targets_per_sample
events:
  yambda-50m-like:
    attributes:
      item:
        field: item_id
      event:
        field: event
    source: yambda
    priority: 1
max_duration_per_sequence: 365d
encoders:
  item:
    type: semantic_id
    preprocessor:
      artifact: item_to_sid
      item_id_column: item_id
    embedder:
      prefix_length: 4
  event:
    type: id
    preprocessor:
      categories:
      - yambda-50m-like
    embedder:
      dim: 32
features:
  item:
    located_in:
      event: true
      context: false
      artifacts: false
    encoder: item
    transform: null
  event:
    located_in:
      event: true
      context: false
      artifacts: false
    encoder: event
    transform: null
event_encoders:
  history:
    type: concat_projection
    params:
      additive_features:
      - event
inputs:
  short:
    type: sequence
    events:
    - yambda-50m-like
    features:
    - item
    - event
    optional_features: []
    max_events_per_sequence: 8
    max_priority_events_per_sequence: null
    max_duration_per_sequence: null
    event_encoder: history
    aggregation: null
    compression: null
  like:
    type: sequence
    events:
    - yambda-50m-like
    features:
    - item
    - event
    optional_features: []
    max_events_per_sequence: 8
    max_priority_events_per_sequence: null
    max_duration_per_sequence: null
    event_encoder: history
    aggregation: null
    compression: null
  lifelong:
    selection: priority
    type: sequence
    events:
    - yambda-50m-like
    features:
    - item
    - event
    optional_features: []
    max_events_per_sequence: 16
    max_priority_events_per_sequence: null
    max_duration_per_sequence: null
    event_encoder: history
    aggregation: null
    compression:
      type: qformer
      params:
        num_queries: 4
        num_layers: 1
        num_heads: 2
        dim_feedforward: 64
model:
  type: onerec
  params:
    backbone: t5
    dim: 32
    num_heads: 2
    dim_feedforward: 64
    dropout: 0.0
    weight_initialization: default
    target_chunk_size: 128
    encoder:
      num_layers: 1
      position_embeddings:
      - daily_recency
      - qformer_recency
      - absolute
      source_position_layout: fixed
    decoder:
      num_layers: 1
      level_embeddings: true
    decoder_activation_checkpointing: false
training:
  num_epochs: 1
  log_every_n_train_steps: 1
  validation_every_n_epochs: 1
  tracker:
    type: logging
    params: {}
  dataloader:
    batch_size: 4
    num_workers: 0
    pin_memory: false
    shuffle: true
    seed: 42
  validation_dataloader:
    batch_size: 2
    num_workers: 0
    pin_memory: false
  optimizer:
    type: adam
    params:
      lr: 0.0005
  scheduler:
    type: constant
    params: {}
  early_stopping: null
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  mixed_precision: 'no'
inference:
  event_store_backend: disk
  predict_kwargs:
    k: 10
    beam_size: 10
  dataloader:
    batch_size: 2
    num_workers: 0
    pin_memory: false
  mixed_precision: 'no'
