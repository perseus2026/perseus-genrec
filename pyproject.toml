[tool.poetry]
name = "genrec-perseus"
version = "0.1.0"
description = ""
authors = []
packages = [
    { include = "genrecsys", from = "src" },
    { include = "model_datasets", from = "src" },
    { include = "item_representations", from = "src" },
    { include = "data_sources", from = "src" },
]



[tool.poetry.dependencies]
python = ">=3.12,<3.14"
torch = "^2.6.0"
numpy = "^2.2.1"
polars = ">=1.39.3"
clearml = "^1.17.0"
tqdm = "^4.67.1"
hydra-core = "^1.3.2"
transformers = "^4.51.3"
accelerate = "^1.6.0"
pyarrow = "^22.0.0"
scikit-learn = "^1.8.0"
mmh3 = "5.2.1"
cyclopts = "4.16.1"
sentence-transformers = "5.5.1"
protobuf = "^7.34.1"
sentencepiece = "^0.2.1"
huggingface-hub = "^0.36.0"

[tool.poetry.group.amazon-download]
optional = true

[tool.poetry.group.amazon-download.dependencies]
gdown = "5.2.0"

[tool.poetry.scripts]
genrecsys = "genrecsys.cli:run_app"
item-semantic-ids = "item_representations.semantic_ids.cli:app"
tecd-model-dataset = "model_datasets.tecd.cli:app"
yambda-model-dataset = "model_datasets.yambda.cli:app"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
